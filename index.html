<!DOCTYPE html>
<!-- Power Mind — web build entry page (WEB_APP_PLAN.md, Phase 5).
     Loads the wasm-bindgen glue in web/pkg/ (built by build.ps1, not
     checked in) and starts the same App the native window runs, via the
     WebHandle defined in src/lib.rs. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Power Mind</title>
  <link rel="icon" href="../assets/icon.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f5f5;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    /* An application-like title bar — the web build otherwise runs edge to
       edge in the browser viewport with nothing to say what it is. */
    #titlebar {
      flex: 0 0 auto;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #26272B;
      border-bottom: 1px solid #000000;
      color: #F0F0F2;
      font: 600 13px/1 -apple-system, "Segoe UI", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #titlebar img {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }
    #app {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    #the_canvas_id {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #444;
    }
    #error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #a00;
      background: #fff;
      padding: 2rem;
      text-align: center;
      white-space: pre-wrap;
    }
    @media (prefers-color-scheme: dark) {
      /* The title bar stays the same dark shade in both modes — it is
         chrome, not canvas content, and a constant colour reads as the
         app's own bar rather than following the OS theme. */
      html, body { background: #1E1E1E; }
      #error { background: #1E1E1E; }
    }
  </style>
</head>

    <span>Power Mind</span>
  </div>
  <div id="app">
    <div id="loading">Loading Power Mind…</div>
    <div id="error"></div>
    <canvas id="the_canvas_id"></canvas>
  </div>
  <script type="module">
    import init, { WebHandle } from "./pkg/powermind.js";

    async function main() {
      await init();
      const handle = new WebHandle();
      const canvas = document.getElementById("the_canvas_id");
      try {
        await handle.start(canvas);
        document.getElementById("loading").remove();
      } catch (e) {
        // A thrown error before the panic hook is installed, or a resize/
        // graphics-context failure — show it rather than leaving a frozen
        // "Loading…" message.
        showError(e);
        throw e;
      }

      // The panic hook (installed inside WebHandle::new) catches panics
      // after start() succeeds; poll for one so a crash mid-session shows
      // the same error view instead of a silently frozen canvas.
      setInterval(() => {
        if (handle.has_panicked()) {
          showError(handle.panic_message() ?? "Power Mind crashed.");
        }
      }, 1000);
    }

    function showError(e) {
      document.getElementById("loading").remove();
      const box = document.getElementById("error");
      box.textContent = "Power Mind failed to start:\n" + e;
      box.style.display = "flex";
    }

    main();
  </script>
